name: Generate Resume PDF

on:
  push:
    paths:
      - 'data/resume.json'
      - 'data/stats.json'
      - 'src/pages/ResumePage.jsx'
      - 'scripts/make-resume-pdf.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build site and generate Resume PDF
        run: npm run build

      - name: Commit and push updated resume.pdf
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/resume.pdf
          if git diff --staged --quiet; then
            echo "No changes in resume.pdf"
          else
            git commit -m "chore(resume): auto-generate updated public/resume.pdf [skip ci]"
            git push
          fi
