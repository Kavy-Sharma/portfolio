name: Update Project Previews

on:
  schedule:
    # Run daily at 00:30 UTC
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-previews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate previews
        run: node scripts/make-previews.mjs

      - name: Commit and Push if Changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/previews/
          if git diff --staged --quiet; then
            echo "No preview changes detected. Skipping commit."
          else
            git commit -m "chore(previews): update daily project screenshots [skip ci]"
            git push
          fi
