name: Update GitHub Data

on:
  schedule:
    # Runs daily at 01:15 UTC
    - cron: '15 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch GitHub data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-github.mjs

      - name: Commit and push if data/github.json changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/github.json
          if git diff --staged --quiet; then
            echo "No data changes detected in data/github.json."
          else
            git commit -m "chore(data): auto-update github.json [skip ci]"
            git push
          fi
